<div class="container mt-4">
  <h2>Perfil de Usuario</h2>
  <p><strong>Nombre:</strong> {{ user.name }}</p>
  <p><strong>Correo:</strong> {{ user.email }}</p>

  <div class="row mt-4">
    <div class="col-md-6">
      <h4>Templates</h4>
      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let template of templates">
          {{ template.name }}
          <a class="btn btn-sm btn-primary" [routerLink]="['/cards/editor', template.id]">Editar</a>
        </li>
      </ul>
    </div>

    <div class="col-md-6">
      <h4>CSV Datasets</h4>
      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let csv of csvDatasets">
          {{ csv.name }}
          <a class="btn btn-sm btn-secondary" [routerLink]="['/cards/csv', csv.id]">Ver</a>
        </li>
      </ul>
      <a class="btn btn-success mt-3" routerLink="/cards/csv">Añadir un nuevo CSV</a>
    </div>
  </div>
</div>
