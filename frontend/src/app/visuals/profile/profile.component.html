<div class="container mt-4">
    <h2>Perfil de Usuario</h2>
    <p><strong>Nombre:</strong> {{ user.name }}</p>
    <p><strong>Correo:</strong> {{ user.email }}</p>
  
    <div class="row mt-4">
      <div class="col-md-6">
        <h4>Templates</h4>
        <ul class="list-group">
          <li class="list-group-item" *ngFor="let template of templates">
            {{ template.name }}
          </li>
        </ul>
      </div>
  
      <div class="col-md-6">
        <h4>CSV Datasets</h4>
        <ul class="list-group">
          <li class="list-group-item" *ngFor="let csv of csvDatasets">
            {{ csv.name }}
          </li>
        </ul>
      </div>
    </div>
  </div>
