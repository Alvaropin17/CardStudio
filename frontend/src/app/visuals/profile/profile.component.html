<div class="container mt-4">
  <h2>Perfil de Usuario</h2>
  <div class="profile-info">
    <p><strong>Nombre:</strong> {{ user.name }}</p>
    <p><strong>Correo:</strong> {{ user.email }}</p>
  </div>

  <div class="accordion">
    <div class="accordion-header" (click)="toggleAccordion()">
      <h2>Editar perfil</h2>
      <span class="accordion-icon">{{ isOpen ? '−' : '+' }}</span>
    </div>
    <div class="accordion-content" [class.open]="isOpen">
      <form [formGroup]="modifyForm" (ngSubmit)="updateProfile()">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" type="text" formControlName="name" placeholder="Introduce tu nombre" />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="Introduce tu correo" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="Introduce tu nueva contraseña" />
        </div>

        <button type="submit" [disabled]="modifyForm.invalid">Actualizar perfil</button>
      </form>
    </div>
  </div>
</div>
