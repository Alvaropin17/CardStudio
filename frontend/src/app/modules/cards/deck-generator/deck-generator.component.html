    <div style="align-items: center; display: flex; justify-content: center; height: 100%;">
        <div>
            <div class="folder-upload" style="padding: 20px;">
                <button (click)="triggerFolderInput()">Subir carpeta de imágenes</button>
                <input #folderInput type="file" webkitdirectory directory multiple accept="image/*"
                    (change)="handleFolderSelection($event)" style="display: none;">
            </div>
            <div class="genera-button" style="padding: 20px;">
                <p style="align-content: center; font-size: 20px; color: white;">El mazo se generará como un zip con todas las imágenes</p>
                <button (click)="generateDeck(false)">Generar mazo como zip</button>
            </div>
            <div class="genera-button" style="padding: 20px;">
                <p style="align-content: center; font-size: 20px; color: white;">El mazo se generará como un PDF listo para imprimir</p>
                <button (click)="generateDeck(true)">Generar mazo como PDF</button>
            </div>
        </div>
    </div>
