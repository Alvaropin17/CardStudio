<div>


    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Plantillas</h4>

            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    *ngFor="let template of templates" [class.selected]="template.id === selectedTemplate?.id"
                    (click)="onSelectTemplate(template)">
                    {{ template.name }}
                    <div class="action-buttons" *ngIf="template.id === selectedTemplate?.id">
                        <button class="btn-link btn-link--delete" (click)="assingCsvToTemplate()">
                            Asignar CSV
                        </button>
                        <a class="btn-link btn-link--edit" [routerLink]="['/cards/editor', template.id]">
                            Editar
                        </a>
                        <button class="btn-link btn-link--delete" (click)="deleteTemplate(template.id)">
                            Eliminar
                        </button>
                    </div>
                </li>
            </ul>
        </div>

        <div class="col-md-6">
            <h4>CSV Datasets</h4>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    *ngFor="let csv of csvDatasets" [class.selected]="csv.id === selectedCsv?.id"
                    (click)="onSelectCsv(csv)">
                    {{ csv.name }}
                    <div class="action-buttons"  *ngIf="csv.id === selectedCsv?.id">
                        <a class="btn-link btn-link--edit" [routerLink]="['/cards/csv', csv.id]">
                            Editar
                        </a>
                        <button class="btn-link btn-link--delete" (click)="deleteCSV(csv.id)">
                            Eliminar
                        </button>
                    </div>
                </li>
            </ul>
            <a class="btn btn-success mt-3" routerLink="/cards/csv">Añadir un nuevo CSV</a>
        </div>
    </div>
</div>
