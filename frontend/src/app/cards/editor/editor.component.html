<div class="editor-container">
  <div class="toolbar">
    <div style="display: flex; justify-content: space-around;">
      <div class="color-picker">
        <label>
          Color:
          <input type="color" [(ngModel)]="selectedColor" />

        </label>
      </div>
      <div class="color-picker">
        <label>
          Fuente:
          <select [(ngModel)]="selectedFont" (change)="onFontChange()" style="width: 4rem; ">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Impact">Impact</option>
          </select>

        </label>
      </div>
      <div class="color-picker">
        <label>
          Tamaño:
          <input type="number" [(ngModel)]="selectedFontSize" style="max-width: 2rem;" />
        </label>
      </div>
    </div>


    <button (click)="addText()">Añadir texto</button>
    <button (click)="addRectangle()">Añadir rectángulo</button>
    <button (click)="addCircle()">Añadir círculo</button>
    <button (click)="addCanvasBorder()">Añadir borde</button>
    <button (click)="loadImage('dragon.jpg')">Añadir imagen</button>
    <button (click)="deleteActiveObject()">Eliminar elemento</button>
    <button (click)="clearCanvas()">Limpiar</button>
    <button (click)="exportCanvasAsJson()">Exportar a JSON</button>
    <div *ngIf="templateToSave" class="mt-3">
      <label for="templateName">Nombre de la plantilla:</label>
      <input type="text" id="templateName" [(ngModel)]="templateName" placeholder="Ej: Plantilla Magic" />
      <button class="btn btn-primary mt-2" (click)="saveCanvas()">Procesar</button>
    </div>
    <div class="folder-upload">
      <button (click)="triggerFolderInput()">Seleccionar Carpeta</button>
      <input #folderInput type="file" webkitdirectory directory multiple accept="image/*"
        (change)="handleFolderSelection($event)" style="display: none;">
    </div>
  </div>

  <canvas #canvas></canvas>

  <!------------------------------------------------------------------------------------------------------------------------------->



  <div class="position-control toolbar">

    <div *ngIf="activeObject" class="editor-panel">
      <h3>Editar objeto:</h3>

      <div class="object-name">
        <label>
          Nombre del objeto:
          <input type="text" [(ngModel)]="newName" [placeholder]="getActiveObjectName()"
            (keydown.enter)="setNewName()" />
        </label>
      </div>
      <!-- Text -->
      <div *ngIf="isTextObject()" class="form-group">
        <label>Texto:</label>
        <input type="text" [ngModel]="getTextProperty('text')" (ngModelChange)="setTextProperty('text', $event)"
          class="form-control" />
      </div>

      <!-- Color -->
      <div class="form-group">
        <label>Color de relleno:</label>
        <input type="color" [value]="getObjectColor()" (input)="updateProperty('fill', $any($event.target).value)"
          class="form-control" />
      </div>

      <!-- Font size -->
      <div *ngIf="isTextObject()" class="form-group">
        <label>Tamaño de fuente:</label>
        <input type="number" [value]="getTextProperty('fontSize')"
          (input)="setTextProperty('fontSize', $any($event.target).value)" min="8" max="120" class="form-control" />
      </div>

      <!-- TODOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO -->

      <div *ngIf="isTextObject()" class="form-group">
        <label>Campo de csv asignado:</label>
        <input  />
      </div>

      <!-- Position -->
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Posición X:</label>
          <input type="number" [ngModel]="activeObject.left" (ngModelChange)="updateProperty('left', $event)"
            class="form-control" />
        </div>
        <div class="form-group col-md-6">
          <label>Posición Y:</label>
          <input type="number" [ngModel]="activeObject.top" (ngModelChange)="updateProperty('top', $event)"
            class="form-control" />
        </div>
      </div>

      <!-- Opacity -->
      <div class="form-group">
        <label>Opacidad: {{activeObject.opacity | percent:'1.0-2'}}</label>
        <input type="range" [value]="activeObject.opacity"
          (input)="updateProperty('opacity', this.parseFloatNumber($any($event.target).value))" min="0" max="1"
          step="0.01" class="form-control" />
      </div>

      <!-- Rotation -->
      <div class="form-group">
        <label>Rotación: {{activeObject.angle}}°</label>
        <input type="range" [value]="activeObject.angle"
          (input)="updateProperty('angle', this.parseFloatNumber($any($event.target).value))" min="0" max="360"
          class="form-control" />
      </div>

    </div>
    <h3>Objetos en el lienzo</h3>
    <div class="arrow-buttons">
      <button (click)="bringToFront()" title="Traer al frente">⏫</button>
      <button (click)="moveUp()" title="Subir una capa">🔼</button>
      <button (click)="moveDown()" title="Bajar una capa">🔽</button>
      <button (click)="sendToBack()" title="Enviar al fondo">⏬</button>
    </div>
    <ul class="object-list">
      <li class="list-element" *ngFor="let object of canvasObjectsList" (click)="selectObjectFromList(object)">
        <strong>{{ object.name }}</strong> ({{ object.type }})<br />
      </li>
    </ul>

  </div>


</div>
